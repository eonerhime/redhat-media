name: preview-headers

# Runs when Vercel reports a successful preview deployment and checks that the
# deployed response carries every header from lib/security/headers.ts.
on: deployment_status

permissions:
  contents: read

jobs:
  preview-headers:
    name: preview-headers
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check served security headers
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Secret VERCEL_AUTOMATION_BYPASS_SECRET is not set"
            exit 1
          fi
          node scripts/check-preview-headers.mts "$PREVIEW_URL"

  # The portfolio as a visitor sees it: the deployed preview, reading the
  # CI-seeded Neon preview branch and real Cloudinary images. The CI build has
  # no database, so this is where the ready state is proven (Phase 10 spec, D11).
  preview-e2e:
    name: preview-e2e
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Portfolio e2e against the preview
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PW_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          E2E_PORTFOLIO_STATE: ready
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::Secret VERCEL_AUTOMATION_BYPASS_SECRET is not set"
            exit 1
          fi
          pnpm test:e2e e2e/portfolio.spec.ts
