name: monitor

# The hourly site and Neon monitor (Phase 15 spec, D7). A failed run makes GitHub email the
# account that last changed the cron line below. GitHub runs `schedule` and `workflow_dispatch`
# only from the default branch, so both start at the Phase 16 release. Until then a test alert is
# sent by adding the `test-alert` label to a PR: the run does the real checks, then fails on
# purpose with "TEST ALERT — not an incident".
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Fail on purpose after the checks, to test the alert email
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  monitor:
    name: monitor
    if: github.event_name != 'pull_request' || github.event.label.name == 'test-alert'
    runs-on: ubuntu-latest
    # Holds MONITOR_DATABASE_URL (rhm_readonly): the preview branch in Phase 15, production from 16.
    environment: monitor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the site and Neon
        env:
          MONITOR_BASE_URL: ${{ vars.MONITOR_BASE_URL }}
          MONITOR_DATABASE_URL: ${{ secrets.MONITOR_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          MONITOR_TEST_ALERT: ${{ (github.event_name == 'pull_request' || inputs.test_alert) && '1' || '' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/monitor.mts
